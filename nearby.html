<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nearby Help - MindMitra</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }

        #map {
            height: 500px;
            width: 100%;
            border-radius: 15px;
        }

        .buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 20px 0;
        }

        button {
            padding: 12px 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
        }
    </style>
</head>

<body>

    <h1>📍 Nearby Help</h1>

    <div class="buttons">

        <button>🏧 ATM</button>
        <button>🏥 Hospital</button>
        <button>💊 Pharmacy</button>
        <button>⛽ Petrol Pump</button>
        <button>👮 Police Station</button>
        <button>🍽️ Restaurant</button>

    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
   <script>
    navigator.geolocation.getCurrentPosition(
        function(position) {

            const lat = position.coords.latitude;
            const lng = position.coords.longitude;

            const map = L.map("map");

            map.setView([lat, lng], 15);

            L.tileLayer(
                "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
                {
                    attribution: "© OpenStreetMap contributors"
                }
            ).addTo(map);

            L.marker([lat, lng])
                .addTo(map)
                .bindPopup("📍 You are here")
                .openPopup();

        },

        function(error) {
            alert("Location permission is required.");
            console.log(error);
        }
    );
</script>

</body>
</html>
